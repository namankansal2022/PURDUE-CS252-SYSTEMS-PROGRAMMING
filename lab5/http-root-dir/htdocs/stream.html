<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS252: HTTP Live Streaming</title>
    <link rel="icon" href="../icons/favicon.ico" type="image/x-icon">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 680px;
            margin: 0 auto;
        }
        h1 {
            color: #333;
        }
        .stream-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            background-color: black;
            margin: 0 auto;
            border-radius: 10px;
            border: 2px solid #ddd;
            overflow: hidden;
        }
        .stream {
            display: block;
            width: 100%;
            height: 360px;
            object-fit: cover;
        }
        .back-button {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 15px;
            text-decoration: none;
            color: white;
            background-color: #007bff;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .back-button:hover {
            background-color: #0056b3;
        }
        
        /* Lets make it responsive */
        @media (max-width: 680px) {
            .container {
                padding: 15px;
                width: calc(100% - 30px);
            }
            .stream-container {
                width: 100%;
            }
            .stream {
                height: auto;
                min-height: 180px;
                max-height: 50vh;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Live Stream</h1>
        <div class="stream-container">
            <img id="streamImage" src="/stream/play" class="stream" alt="Live Stream">
        </div>
        <br>
        <a href="/" class="back-button">Go Back</a>
    </div>
</body>
</html>
